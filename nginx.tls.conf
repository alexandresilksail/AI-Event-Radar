# AI Event Radar — OPTIONAL TLS variant.
# Use ONLY when TLS is terminated by THIS nginx (certificates mounted from the
# host, e.g. via scripts/deploy.sh with CERT_FULLCHAIN/CERT_PRIVKEY set).
# If an upstream proxy (cloud LB, frp, tunnel) terminates TLS, keep
# nginx.prod.conf instead — this app never claims HTTP nginx is HTTPS.
#
# Enable:  cp nginx.tls.conf nginx.prod.conf   (then deploy.sh mounts certs)
server {
    listen 80;
    server_name _;
    # permanent redirect to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # trust ONLY the loopback upstream proxy for client-IP headers.
    # Client-supplied X-Forwarded-* from untrusted sources is ignored.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        # only forward protocol/host as seen by this TLS endpoint
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
