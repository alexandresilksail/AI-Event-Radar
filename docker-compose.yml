services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: radar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://radar:${POSTGRES_PASSWORD:-change-me}@db:5432/radar
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - appdata:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    image: node:22-alpine
    working_dir: /web
    volumes:
      - ./frontend:/web
    command: sh -c "npm install --no-audit --no-fund && npm run build && npx vite preview --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
