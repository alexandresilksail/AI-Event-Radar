server {
    listen 80;
    server_name _;

    # API -> FastAPI
    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # 前端静态资源 -> vite preview
    location /web/ {
        proxy_pass http://web:5173/;
        proxy_set_header Host $host;
    }
}
