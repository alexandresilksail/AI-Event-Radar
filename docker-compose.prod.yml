# AI Event Radar — production composition (OCI ARM64 Ubuntu friendly).
# Usage: cp .env.example .env && edit values && docker compose -f docker-compose.prod.yml up -d
#
# Startup order (all conditions are real health/completion checks):
#   db (healthy) -> migrate (one-shot, must exit 0) -> api + worker -> web.
# - `migrate` is a ONE-SHOT service. `api` and `worker` depend on it with
#   condition `service_completed_successfully`, so a FAILED migration blocks
#   both of them from ever starting. `web` depends on `api` being healthy.
# - API/Worker run with AUTO_MIGRATE=false: only the migrate service changes schema.
#
# Database credentials:
#   The effective connection URL is NOT assembled by compose. A password
#   containing `@ : / % + #` or a space cannot be embedded in a URI by string
#   concatenation, and a raw password that merely *looks* percent-encoded
#   would be decoded by the driver and silently corrupted. Instead the
#   discrete parts (DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD) are passed
#   through and app/config.py::encode_db_url() builds the URL, percent-encoding
#   the password exactly once. All three services get identical values, so
#   migrate / api / worker always connect to the same database.
#
#   DATABASE_URL is still exported for tools that read it directly, and it
#   references the same variables (never a hard-coded secret). The discrete
#   DB_* parts take precedence over it inside the application, so the exported
#   URL is never the one the app connects with.
#
# TLS options: see docs/DEPLOY.md §HTTPS (upstream proxy = keep nginx.prod.conf;
# nginx-terminated TLS = swap in nginx.tls.conf and mount certs).
name: ai-event-radar

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-radar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required, set in .env}
      POSTGRES_DB: ${DB_NAME:-radar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    # NOT published to the host: database reachable only on the internal network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  # One-shot schema migration. Runs BEFORE api/worker; failure blocks startup
  # (service_completed_successfully), so a bad migration never goes unnoticed.
  migrate:
    build: { context: ., dockerfile: Dockerfile.api }
    command: ["python", "-m", "app.migrate"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER:-radar}:${DB_PASSWORD}@db:5432/${DB_NAME:-radar}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-radar}
      DB_USER: ${DB_USER:-radar}
      DB_PASSWORD: ${DB_PASSWORD:?required, set in .env}
      ROLE: api
    depends_on: { db: { condition: service_healthy } }
    networks: [internal]
    restart: "no"
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  api:
    build: { context: ., dockerfile: Dockerfile.api }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER:-radar}:${DB_PASSWORD}@db:5432/${DB_NAME:-radar}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-radar}
      DB_USER: ${DB_USER:-radar}
      DB_PASSWORD: ${DB_PASSWORD:?required, set in .env}
      ROLE: api
      AUTO_MIGRATE: "false"
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  worker:
    build: { context: ., dockerfile: Dockerfile.api }
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER:-radar}:${DB_PASSWORD}@db:5432/${DB_NAME:-radar}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-radar}
      DB_USER: ${DB_USER:-radar}
      DB_PASSWORD: ${DB_PASSWORD:?required, set in .env}
      ROLE: worker
      AUTO_MIGRATE: "false"
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [internal]
    # worker health = its own embedded server (not the API's); port NOT published
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  web:
    build: { context: ., dockerfile: Dockerfile.web }
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "${HTTP_PORT:-80}:80"
    networks: [internal]
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

networks:
  internal: { internal: false }
volumes:
  pgdata:
