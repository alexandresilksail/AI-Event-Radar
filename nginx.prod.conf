# AI Event Radar — production Nginx: single public entry point.
# HTTPS: TLS is terminated UPSTREAM of this container (see docs/DEPLOY.md §HTTPS).
# This file is HTTP-only by design; do not claim it provides TLS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # limit request size (also mitigates oversized JSON uploads)
    client_max_body_size 2m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # nginx liveness: exact-match location, NOT subject to SPA try_files.
    # Container HEALTHCHECK uses this (never fakes ready via SPA fallback).
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # API -> FastAPI api service (internal network only)
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # pass JWT Authorization header through untouched
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames under /assets/, so they can be
    # cached aggressively. Without this every page load re-downloads the
    # whole JS/CSS bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must never be cached: it references the hashed asset names,
    # so a stale copy would point at assets that no longer exist.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location ~ /\. {
        deny all;
    }
}
