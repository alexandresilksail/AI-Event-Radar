# AI Event Radar — production Nginx: single public entry point.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # limit request size (also mitigates oversized JSON uploads)
    client_max_body_size 2m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # API -> FastAPI api service (internal network only)
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # pass JWT Authorization header through untouched
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
